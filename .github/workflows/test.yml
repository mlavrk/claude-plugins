name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The mod API is early access; pin the version the mods are built against.
      - run: npm install -g @anthropic-ai/claude-code@2.1.301
      - run: claude plugin validate .
      - run: |
          for dir in plugins/*/; do
            claude plugin validate "$dir"
            if ls "$dir"tests/*.test.ts* >/dev/null 2>&1; then
              claude plugin test "$dir"
            fi
            if ls "$dir"tests/*.test.sh >/dev/null 2>&1; then
              for t in "$dir"tests/*.test.sh; do bash "$t"; done
            fi
          done
