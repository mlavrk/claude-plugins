name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 ships jq 1.6, the oldest version we support.
        os: [ubuntu-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: jq --version && bash --version | head -1
      - run: bash plugins/usage-statusline/tests/run.sh
